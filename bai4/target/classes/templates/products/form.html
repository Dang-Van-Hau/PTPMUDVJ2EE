<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${isEdit} ? 'Edit Product' : 'Add Product'">Product Form</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        form { max-width: 560px; display: grid; gap: 10px; }
        input, textarea { width: 100%; padding: 8px; box-sizing: border-box; }
        .err { color: #b00020; font-size: 13px; }
    </style>
</head>
<body>
<h2 th:text="${isEdit} ? 'Edit Product' : 'Add Product'"></h2>

<form th:object="${product}"
      th:action="${isEdit} ? @{/products/edit/{id}(id=${product.id})} : @{/products/add}"
      method="post"
      enctype="multipart/form-data">
    <div>
        <label>Name</label>
        <input type="text" th:field="*{name}">
        <div class="err" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
    </div>

    <div>
        <label>Price</label>
        <input type="number" step="0.01" th:field="*{price}">
        <div class="err" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
    </div>

    <div>
        <label>Description</label>
        <textarea rows="4" th:field="*{description}"></textarea>
    </div>

    <div>
        <label>Image</label>
        <input type="file" name="imageFile" accept="image/*">
        <div th:if="${isEdit and product.imageName != null and !#strings.isEmpty(product.imageName)}">
            <p>Current image:</p>
            <img th:src="@{/uploads/{img}(img=${product.imageName})}" alt="Current image" style="max-width:220px; border:1px solid #ddd;">
        </div>
    </div>

    <div>
        <button type="submit">Save</button>
        <a th:href="@{/products}">Back</a>
    </div>
</form>
</body>
</html>
