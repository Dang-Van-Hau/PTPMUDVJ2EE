<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      xmlns:custom="http://www.w3.org/1999/xhtml"
      layout:decorate="~{_layout}">
<head>
    <meta charset="UTF-8">
    <title>List products</title>
</head>
<body>
    <div layout:fragment="content" class="container body-content">
        <a th:if="${isAdmin}" th:href="@{products/create}" class="btn btn-primary">Create New Product</a>
        
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>#</th>
                    <th>Name</th>
                    <th>Price</th>
                    <th>Image</th>
                    <th>Category Name</th>
                    <th></th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="product: ${listproduct}">
                    <th scope="row" th:text="${product.id}"></th>
                    <td th:text="${product.name}"></td>
                    <td th:text="${product.price}"></td>
                    <td>
                        <img th:src="@{|/images/${product.image}|}" 
                             alt="Product Image" 
                             height="120" 
                             width="150">
                    </td>
                    <td th:text="${product.category?.name ?: ''}"></td>
                    <td th:if="${isAdmin}">
                        <a th:href="@{/products/edit/{id}(id=${product.id})}" 
                           class="btn btn-secondary">Edit</a>
                        <form th:action="@{/products/delete/{id}(id=${product.id})}"
                              method="post"
                              style="display:inline;">
                            <button type="submit"
                                    class="btn btn-danger"
                                    onclick="return confirm('Bạn có chắc chắn muốn xóa sản phẩm này?')">
                                Delete
                            </button>
                        </form>
                    </td>
                    <td th:unless="${isAdmin}">
                        <span class="text-muted">Read only</span>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
