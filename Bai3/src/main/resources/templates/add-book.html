<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/layout}">
<head>
    <title layout:fragment="title">Thêm sách mới</title>
</head>
<body>
<div layout:fragment="content">
    <h2>Thêm sách mới</h2>
    <form th:action="@{/books/add}" th:object="${book}" method="post" class="row g-3">
        <div class="col-12">
            <label for="title" class="form-label">Tiêu đề sách</label>
            <input type="text" class="form-control" id="title" th:field="*{title}" required>
        </div>
        <div class="col-12">
            <label for="author" class="form-label">Tác giả sách</label>
            <input type="text" class="form-control" id="author" th:field="*{author}" required>
        </div>
        <div class="col-12">
            <button type="submit" class="btn btn-primary">Thêm</button>
            <a th:href="@{/books}" class="btn btn-secondary">Hủy</a>
        </div>
    </form>
</div>
</body>
</html>
