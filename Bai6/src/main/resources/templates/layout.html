<!DOCTYPE html>
<html lang="en" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout" xmlns:th="http://www.w3.org/1999/xhtml">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <meta name="description" content="Quản lý sản phẩm và cửa hàng"/>
    <title>Bài 6 - QLSP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
          crossorigin="anonymous"/>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/shop}">Cửa hàng</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                    <li class="nav-item"><a class="nav-link" th:href="@{/shop}">Sản phẩm</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/cart}">Giỏ hàng</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/products}">Quản trị SP</a></li>
                    <li class="nav-item"><a class="nav-link" th:href="@{/products/create}">Thêm SP</a></li>
                </ul>
                <form class="d-flex" role="search" th:action="@{/shop}" method="get">
                    <input type="hidden" name="page" value="0"/>
                    <input type="hidden" name="sort" value="asc"/>
                    <input type="hidden" name="categoryId" value="0"/>
                    <input class="form-control me-2" type="search" placeholder="Tìm theo tên" name="keyword"/>
                    <button class="btn btn-outline-success" type="submit">Tìm</button>
                </form>
            </div>
        </div>
    </nav>
    <div layout:fragment="content" class="container body-content"></div>
    <div class="card-footer text-center">
        <hr/>
        <p>&copy; 2025 Phát triển ứng dụng với J2EE</p>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
            crossorigin="anonymous"></script>
</body>
</html>
