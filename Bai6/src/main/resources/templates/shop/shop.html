<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8"/>
    <title>Cửa hàng</title>
</head>
<body>
<div layout:fragment="content" class="container body-content">
    <h2 class="mb-3">Danh sách sản phẩm</h2>
    <form class="row g-2 mb-4" th:action="@{/shop}" method="get">
        <div class="col-md-3">
            <label class="form-label">Tìm theo tên</label>
            <input class="form-control" type="text" name="keyword" placeholder="Nhập từ khóa"
                   th:value="${keyword}">
        </div>
        <div class="col-md-3">
            <label class="form-label">Danh mục</label>
            <select class="form-select" name="categoryId">
                <option value="0" th:selected="${categoryId == 0}">Tất cả</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}"
                        th:selected="${categoryId == cat.id}">
                </option>
            </select>
        </div>
        <div class="col-md-3">
            <label class="form-label">Sắp xếp theo giá</label>
            <select class="form-select" name="sort">
                <option value="asc" th:selected="${sort == 'asc'}">Tăng dần</option>
                <option value="desc" th:selected="${sort == 'desc'}">Giảm dần</option>
            </select>
        </div>
        <div class="col-md-3 d-flex align-items-end">
            <button type="submit" class="btn btn-primary me-2">Tìm kiếm</button>
            <a class="btn btn-outline-secondary" th:href="@{/shop}">Xóa bộ lọc</a>
        </div>
        <input type="hidden" name="page" value="0"/>
    </form>

    <div th:if="${productPage.isEmpty()}" class="alert alert-info">Không có sản phẩm phù hợp.</div>

    <div class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4" th:if="${!productPage.isEmpty()}">
        <div class="col" th:each="product : ${productPage.content}">
            <div class="card h-100 shadow-sm">
                <div class="card-body">
                    <h5 class="card-title" th:text="${product.name}">Tên</h5>
                    <p class="card-text mb-1">
                        Giá: <span th:text="${product.price}">0</span> đ
                    </p>
                    <p class="card-text text-muted small" th:text="${product.category != null ? product.category.name : ''}">
                        Danh mục
                    </p>
                    <div class="mb-2" th:if="${product.image}">
                        <img th:src="@{/images/{n}(n=${product.image})}" class="img-fluid rounded" alt=""
                             style="max-height: 140px; object-fit: contain;"/>
                    </div>
                    <form th:action="@{/cart/add}" method="post" class="d-flex align-items-center gap-2 flex-wrap">
                        <input type="hidden" name="productId" th:value="${product.id}"/>
                        <input type="hidden" name="redirect" th:value="@{/shop(page=${currentPage},keyword=${keyword},categoryId=${categoryId},sort=${sort})}"/>
                        <label class="mb-0">SL</label>
                        <input class="form-control form-control-sm" type="number" name="quantity" value="1" min="1"
                               style="width: 5rem"/>
                        <button type="submit" class="btn btn-success btn-sm">Thêm vào giỏ</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <nav th:if="${productPage.totalPages > 1}" class="mt-4" aria-label="Phân trang">
        <ul class="pagination justify-content-center">
            <li class="page-item" th:classappend="${productPage.first} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/shop(page=${productPage.number - 1},keyword=${keyword},categoryId=${categoryId},sort=${sort})}">Previous</a>
            </li>
            <li class="page-item disabled">
                <span class="page-link"
                      th:text="'Trang ' + ${productPage.number + 1} + ' / ' + ${productPage.totalPages}">Trang</span>
            </li>
            <li class="page-item" th:classappend="${productPage.last} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/shop(page=${productPage.number + 1},keyword=${keyword},categoryId=${categoryId},sort=${sort})}">Next</a>
            </li>
        </ul>
    </nav>
</div>
</body>
</html>
