<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}">
<head>
    <meta charset="UTF-8"/>
    <title>Giỏ hàng</title>
</head>
<body>
<div layout:fragment="content" class="container body-content">
    <h2 class="mb-3">Giỏ hàng</h2>

    <div th:if="${checkoutError}" class="alert alert-danger" th:text="${checkoutError}"></div>

    <div th:if="${#lists.isEmpty(lines)}" class="alert alert-info">
        Giỏ hàng đang trống. <a th:href="@{/shop}">Tiếp tục mua sắm</a>
    </div>

    <div th:if="${!#lists.isEmpty(lines)}">
        <table class="table table-bordered align-middle">
            <thead class="table-light">
            <tr>
                <th>Tên sản phẩm</th>
                <th class="text-end">Đơn giá</th>
                <th class="text-center">Số lượng</th>
                <th class="text-end">Thành tiền</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="line : ${lines}">
                <td th:text="${line.product.name}">Tên</td>
                <td class="text-end" th:text="${line.product.price} + ' đ'">0</td>
                <td class="text-center">
                    <form th:action="@{/cart/update}" method="post" class="d-inline-flex align-items-center gap-1">
                        <input type="hidden" name="productId" th:value="${line.product.id}"/>
                        <input class="form-control form-control-sm" type="number" name="quantity"
                               th:value="${line.quantity}" min="0" style="width: 5rem"/>
                        <button type="submit" class="btn btn-sm btn-outline-primary">Cập nhật</button>
                    </form>
                </td>
                <td class="text-end" th:text="${line.lineTotal} + ' đ'">0</td>
            </tr>
            </tbody>
            <tfoot>
            <tr>
                <th colspan="3" class="text-end">Tổng cộng</th>
                <th class="text-end" th:text="${grandTotal} + ' đ'">0</th>
            </tr>
            </tfoot>
        </table>

        <form th:action="@{/cart/checkout}" method="post" class="mt-3">
            <button type="submit" class="btn btn-primary">Đặt hàng</button>
            <a th:href="@{/shop}" class="btn btn-link">Tiếp tục mua</a>
        </form>
    </div>
</div>
</body>
</html>
