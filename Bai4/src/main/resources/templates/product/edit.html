<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <meta charset="UTF-8">
    <title>Edit product</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow">
                    <div class="card-header bg-warning text-dark">
                        <h2 class="mb-0">Edit Product</h2>
                    </div>
                    <div class="card-body">
                        <div th:if="${error}" class="alert alert-danger" role="alert">
                            <span th:text="${error}"></span>
                        </div>
                        
                        <form th:action="@{/products/edit}" th:object="${product}" method="post" enctype="multipart/form-data"
                              onsubmit="return validateForm()">
                            <input type="hidden" th:field="*{id}">
                            
                            <div class="mb-3">
                                <label for="name" class="form-label">Name: <span class="text-danger">*</span></label>
                                <input class="form-control" type="text" th:field="*{name}" id="name" placeholder="Product Name" required
                                       oninvalid="this.setCustomValidity('Tên sản phẩm không được để trống')" 
                                       oninput="this.setCustomValidity('')">
                                <div th:if="${#fields.hasErrors('name')}" class="text-danger small mt-1">
                                    <span th:errors="*{name}">Error</span>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="price" class="form-label">Price: <span class="text-danger">*</span></label>
                                <input class="form-control" type="number" th:field="*{price}" id="price" placeholder="Price" 
                                       min="1" max="9999999" step="1" required
                                       onkeydown="return event.key !== '-' && event.key !== 'e' && event.key !== 'E' && event.key !== '+' && event.key !== '.'"
                                       oninput="if(this.value < 0) { this.value = ''; } else if(this.value > 9999999) { this.value = 9999999; }"
                                       oninvalid="this.setCustomValidity('Giá sản phẩm phải từ 1 đến 9.999.999')"
                                       onchange="this.setCustomValidity('')">
                                <div th:if="${#fields.hasErrors('price')}" class="text-danger small mt-1">
                                    <span th:errors="*{price}">Error</span>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="image" class="form-label">Image:</label>
                                <div th:if="${product.image != null and !product.image.isEmpty()}" class="mb-2">
                                    <img height="120" width="150" 
                                         th:src="@{|/images/${product.image}|}" 
                                         alt="Current Image" 
                                         class="img-thumbnail"
                                         style="object-fit: cover;">
                                    <p class="text-muted small mt-1">Current image: <span th:text="${product.image}"></span></p>
                                </div>
                                <input class="form-control" type="file" id="image" name="imageProduct" accept="image/png,image/jpeg,image/jpg">
                                <small class="form-text text-muted">Để trống nếu không muốn thay đổi ảnh</small>
                                <div th:if="${#fields.hasErrors('image')}" class="text-danger small mt-1">
                                    <span th:errors="*{image}">Error</span>
                                </div>
                            </div>
                            
                            <div class="mb-3">
                                <label for="category" class="form-label">Category: <span class="text-danger">*</span></label>
                                <select class="form-select" id="category" name="category.id" required>
                                    <option value="">-- Select Category --</option>
                                    <option th:each="category : ${categories}" 
                                            th:value="${category.id}" 
                                            th:selected="${product.category != null and product.category.id == category.id}"
                                            th:text="${category.name}">Category</option>
                                </select>
                                <div th:if="${#fields.hasErrors('category')}" class="text-danger small mt-1">
                                    <span th:errors="*{category}">Error</span>
                                </div>
                            </div>
                            
                            <div class="mt-4">
                                <button type="submit" class="btn btn-success me-2">Update Product</button>
                                <a th:href="@{/products}" class="btn btn-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
        
        <script>
            function validateForm() {
                const nameInput = document.getElementById('name');
                const priceInput = document.getElementById('price');
                
                // Kiểm tra tên không được để trống
                if (!nameInput.value || nameInput.value.trim() === '') {
                    nameInput.setCustomValidity('Tên sản phẩm không được để trống');
                    nameInput.reportValidity();
                    return false;
                }
                
                // Kiểm tra giá không được âm hoặc trống
                if (!priceInput.value || priceInput.value < 1) {
                    priceInput.setCustomValidity('Giá sản phẩm phải từ 1 đến 9.999.999');
                    priceInput.reportValidity();
                    return false;
                }
                
                return true;
            }
        </script>
    </div>
</body>
</html>
