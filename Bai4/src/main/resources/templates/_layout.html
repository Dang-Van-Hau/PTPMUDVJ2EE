<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Product Management System - CRUD Operations">
    <title layout:fragment="title">Demo Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/products}">Home</a>
            <a class="navbar-brand" th:href="@{/products/create}">Products</a>
            <form class="d-flex" role="search" th:action="@{/home/search}" th:method="get">
                <input class="form-control me-2" type="search" name="query" placeholder="Search products..." aria-label="Search" th:value="${searchQuery}">
                <button class="btn btn-outline-success" type="submit">Search</button>
            </form>
        </div>
    </nav>

    <div layout:fragment="content" class="container body-content my-4">
        <!-- Nội dung từng trang sẽ được chèn vào đây -->
    </div>

    <footer class="mt-5 py-4 bg-light">
        <div class="container text-center">
            <hr/>
            <p class="mb-0">&copy; 2025 Phát triển ứng dụng với J2EE - Product Management System</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
