<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{_layout}">
<head>
    <title>404 - Not Found</title>
</head>
<body>
    <div layout:fragment="content">
        <div class="text-center py-5">
            <h1 class="display-1 text-danger">404</h1>
            <h2 class="mb-3">Product Not Found</h2>
            <p class="lead text-muted mb-4">The product you are looking for does not exist or has been deleted.</p>
            <div>
                <a th:href="@{/products}" class="btn btn-primary me-2">Back to Products</a>
                <a th:href="@{/products/create}" class="btn btn-outline-secondary">Create New Product</a>
            </div>
        </div>
    </div>
</body>
</html>
