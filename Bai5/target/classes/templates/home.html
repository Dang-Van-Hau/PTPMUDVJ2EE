<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Course Registration - Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Course Registration</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <form class="d-flex ms-auto me-3" th:action="@{/home}" method="get">
                <input class="form-control me-2" type="search" name="keyword"
                       placeholder="Search courses"
                       th:value="${keyword}">
                <button class="btn btn-outline-light" type="submit">Search</button>
            </form>
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" th:href="@{/home}">Home</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link" th:href="@{/my-courses}">My Courses</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link" th:href="@{/admin/courses}">Manage Courses</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>
                <li class="nav-item" sec:authorize="isAnonymous()">
                    <a class="nav-link" th:href="@{/register}">Register</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button class="btn btn-link nav-link" type="submit">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4">
    <!-- Toast Bootstrap for enroll success -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1080">
        <div id="enrollToast" class="toast align-items-center text-bg-success border-0"
             role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body">
                    Enrolled course successfully.
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <h2 class="mb-3">Courses</h2>

    <div th:if="${#lists.isEmpty(coursePage.content)}" class="alert alert-info">
        No courses found.
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4"
         th:if="${!#lists.isEmpty(coursePage.content)}">
        <div class="col" th:each="c : ${coursePage.content}">
            <div class="card h-100 shadow-sm">
                <div class="ratio ratio-16x9 bg-light">
                    <img th:if="${c.image != null}"
                         th:src="${c.image}"
                         class="card-img-top"
                         alt="Course image">
                    <div th:if="${c.image == null}"
                         class="d-flex align-items-center justify-content-center text-muted">
                        No image
                    </div>
                </div>
                <div class="card-body">
                    <h5 class="card-title" th:text="${c.name}">Course name</h5>
                    <p class="card-text mb-1">
                        Credits: <span th:text="${c.credits}">3</span>
                    </p>
                    <p class="card-text">
                        Lecturer: <span th:text="${c.lecturer}">Lecturer</span>
                    </p>
                    <span class="badge bg-secondary"
                          th:text="${c.categoryName}">
                        Category
                    </span>
                </div>
                <div class="card-footer d-flex justify-content-end">
                    <form th:action="@{/enroll/{id}(id=${c.id})}" method="post"
                          sec:authorize="hasRole('STUDENT')">
                        <button type="submit" class="btn btn-sm btn-primary">Enroll</button>
                    </form>
                    <span sec:authorize="!hasRole('STUDENT')"
                          class="text-muted small ms-2">
                        Login as student to enroll
                    </span>
                </div>
            </div>
        </div>
    </div>

    <!-- Pagination -->
    <nav th:if="${totalPages > 1}" aria-label="Course pages">
        <ul class="pagination justify-content-center mt-4">
            <li class="page-item" th:classappend="${currentPage == 0} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/home(page=${currentPage - 1}, keyword=${keyword})}">
                    Previous
                </a>
            </li>
            <li class="page-item"
                th:each="i : ${#numbers.sequence(0, totalPages - 1)}"
                th:classappend="${i == currentPage} ? 'active'">
                <a class="page-link"
                   th:text="${i + 1}"
                   th:href="@{/home(page=${i}, keyword=${keyword})}">1</a>
            </li>
            <li class="page-item"
                th:classappend="${currentPage + 1 >= totalPages} ? 'disabled'">
                <a class="page-link"
                   th:href="@{/home(page=${currentPage + 1}, keyword=${keyword})}">
                    Next
                </a>
            </li>
        </ul>
    </nav>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
<script>
    (function () {
        const urlParams = new URLSearchParams(window.location.search);
        const toastEl = document.getElementById('enrollToast');
        if (urlParams.has('enrolled') && toastEl) {
            const toast = new bootstrap.Toast(toastEl, {delay: 2500});
            toast.show();
        }
    })();
</script>
</body>
</html>
