<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${course.id} != null ? 'Edit Course' : 'Create Course'">
        Course Form
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Course Registration</a>
    </div>
</nav>

<main class="container my-4">
    <h2 th:text="${course.id} != null ? 'Edit Course' : 'Create Course'"></h2>

    <form th:object="${course}"
          th:action="${course.id} != null ?
                        @{/admin/courses/edit/{id}(id=${course.id})} :
                        @{/admin/courses/create}"
          method="post" class="mt-3">

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input class="form-control" th:field="*{name}">
        </div>

        <div class="mb-3">
            <label class="form-label">Image URL</label>
            <input class="form-control" th:field="*{image}">
            <div class="form-text">Optional: link to course image.</div>
        </div>

        <div class="mb-3">
            <label class="form-label">Credits</label>
            <input class="form-control" type="number" min="1" th:field="*{credits}">
        </div>

        <div class="mb-3">
            <label class="form-label">Lecturer</label>
            <input class="form-control" th:field="*{lecturer}">
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <select class="form-select" th:field="*{category}">
                <option th:value="${null}">-- Select category --</option>
                <option th:each="cat : ${categories}"
                        th:value="${cat.id}"
                        th:text="${cat.name}">
                </option>
            </select>
        </div>

        <button type="submit" class="btn btn-primary">Save</button>
        <a class="btn btn-secondary" th:href="@{/admin/courses}">Cancel</a>
    </form>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
