<!DOCTYPE html>
<html lang="en"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
    <link rel="stylesheet"
          href="https://cdn.jsdelivr.net/npm/@sweetalert2/theme-bootstrap-4@5/bootstrap-4.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Course Registration</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/home}">Home</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('STUDENT')">
                    <a class="nav-link" th:href="@{/my-courses}">My Courses</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link active" aria-current="page"
                       th:href="@{/admin/courses}">Manage Courses</a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <form th:action="@{/logout}" method="post" class="d-inline">
                        <button class="btn btn-link nav-link" type="submit">Logout</button>
                    </form>
                </li>
            </ul>
        </div>
    </div>
</nav>

<main class="container my-4">
    <!-- Toast Bootstrap (success/update/delete) -->
    <div class="position-fixed top-0 end-0 p-3" style="z-index: 1080">
        <div id="courseToast" class="toast align-items-center text-bg-success border-0"
             role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body" id="courseToastMessage">
                    Action successful.
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto"
                        data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Manage Courses</h2>
        <a class="btn btn-primary" th:href="@{/admin/courses/create}">Create Course</a>
    </div>

    <table class="table table-striped table-bordered align-middle">
        <thead class="table-light">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Credits</th>
            <th>Lecturer</th>
            <th>Category</th>
            <th style="width: 160px;">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(courses)}">
            <td colspan="6" class="text-center">No courses.</td>
        </tr>
        <tr th:each="c : ${courses}">
            <td th:text="${c.id}"></td>
            <td th:text="${c.name}"></td>
            <td th:text="${c.credits}"></td>
            <td th:text="${c.lecturer}"></td>
            <td th:text="${c.category != null ? c.category.name : 'Uncategorized'}"></td>
            <td>
                <a class="btn btn-sm btn-outline-primary"
                   th:href="@{/admin/courses/edit/{id}(id=${c.id})}">Edit</a>

                <form th:action="@{/admin/courses/delete/{id}(id=${c.id})}"
                      method="post"
                      class="d-inline delete-form">
                    <button type="submit" class="btn btn-sm btn-outline-danger">
                        Delete
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script>
    // SweetAlert confirm delete
    document.querySelectorAll('.delete-form').forEach(function (form) {
        form.addEventListener('submit', function (e) {
            e.preventDefault();
            Swal.fire({
                title: 'Delete this course?',
                text: 'This action cannot be undone.',
                icon: 'warning',
                showCancelButton: true,
                confirmButtonText: 'Yes, delete',
                cancelButtonText: 'Cancel'
            }).then((result) => {
                if (result.isConfirmed) {
                    form.submit();
                }
            });
        });
    });

    // Bootstrap toast for ?success / ?updated / ?deleted
    (function () {
        const urlParams = new URLSearchParams(window.location.search);
        const toastEl = document.getElementById('courseToast');
        const toastMsg = document.getElementById('courseToastMessage');
        if (!toastEl || !toastMsg) {
            return;
        }
        let msg = null;
        if (urlParams.has('success')) {
            msg = 'Course created successfully.';
        } else if (urlParams.has('updated')) {
            msg = 'Course updated successfully.';
        } else if (urlParams.has('deleted')) {
            msg = 'Course deleted successfully.';
            toastEl.classList.remove('text-bg-success');
            toastEl.classList.add('text-bg-warning');
        }
        if (msg) {
            toastMsg.textContent = msg;
            const toast = new bootstrap.Toast(toastEl, {delay: 2500});
            toast.show();
        }
    })();
</script>
</body>
</html>
