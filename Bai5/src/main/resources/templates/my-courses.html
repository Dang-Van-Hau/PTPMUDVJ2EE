<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Courses</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/home}">Course Registration</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false"
                aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>

<main class="container my-4">
    <h2>My Enrolled Courses</h2>

    <table class="table table-striped table-bordered align-middle mt-3">
        <thead class="table-light">
        <tr>
            <th>Course</th>
            <th>Credits</th>
            <th>Lecturer</th>
            <th>Enroll Date</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${#lists.isEmpty(enrollments)}">
            <td colspan="4" class="text-center">You have not enrolled any course.</td>
        </tr>
        <tr th:each="e : ${enrollments}">
            <td th:text="${e.course != null ? e.course.name : ''}"></td>
            <td th:text="${e.course != null ? e.course.credits : ''}"></td>
            <td th:text="${e.course != null ? e.course.lecturer : ''}"></td>
            <td th:text="${#temporals.format(e.enrollDate, 'yyyy-MM-dd HH:mm')}"></td>
        </tr>
        </tbody>
    </table>

    <a class="btn btn-secondary" th:href="@{/home}">Back to Home</a>
</main>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
</script>
</body>
</html>
